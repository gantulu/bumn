name: CI

on:
  push:
    branches:
      - feat/implementation-v1

permissions:
  contents: write

jobs:
  build:
    name: Generate lockfile and verify build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and generate lockfile
        run: npm install --no-audit --no-fund

      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already committed"
            exit 0
          fi
          git commit -m "build: add npm lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verify clean dependency installation
        run: npm ci --no-audit --no-fund

      - name: Build application
        run: npm run build
