name: CI

on:
  push:
    branches:
      - feat/implementation-v1

permissions:
  contents: write

jobs:
  verify:
    name: Typecheck, unit tests, E2E and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install test dependencies and update lockfile
        run: npm install --save-dev vitest @testing-library/react @testing-library/jest-dom @testing-library/user-event jsdom @playwright/test --no-audit --no-fund

      - name: Commit dependency manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency manifest and lockfile are already committed"
            exit 0
          fi
          git commit -m "test: add Vitest and Playwright dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Verify clean dependency installation
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Production build
        run: npm run build
